# Estagio de controle: o monolito permanece integro, mas todo o trafego passa
# pelo NGINX. Isolar este estagio permite separar o custo do salto de rede
# introduzido pelo gateway do custo da extracao de servicos propriamente dita,
# que no Stage 02 ocorrem simultaneamente.

upstream monolith {
    server api:8080;
}

server {
    listen 80;

    location / {
        proxy_pass         http://monolith;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Stage           "01b-monolith-nginx";
    }
}
