# Estagio de controle da camada de roteamento: arquitetura identica a do
# Stage 05, mas com o gateway e o pool de conexoes pareados aos estagios
# 01b a 04, isto e, sem keepalive no upstream e sem pool_max_conns
# explicito. Isolar este estagio permite separar o efeito da mudanca
# arquitetural do efeito da mudanca de configuracao do gateway, que no
# Stage 05 ocorrem simultaneamente.

upstream users_service {
    server users-service:8081;
}

upstream products_service {
    server products-service:8082;
}

upstream orders_service {
    server orders-service:8083;
}

upstream inventory_service {
    server inventory-service:8084;
}

server {
    listen 80;

    location /users {
        proxy_pass         http://users_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Stage           "05b-full-microservices-control";
    }

    location /products {
        proxy_pass         http://products_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Stage           "05b-full-microservices-control";
    }

    location /orders {
        proxy_pass         http://orders_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Stage           "05b-full-microservices-control";
    }

    location /inventory {
        proxy_pass         http://inventory_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Stage           "05b-full-microservices-control";
    }

    location / {
        return 404;
    }
}
